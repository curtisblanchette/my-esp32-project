services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: my-esp32-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  redis:
    image: redis:7-alpine
    container_name: my-esp32-redis
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  # api: removed — Cortex (Python/FastAPI) now serves the API natively on port 8000

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: my-esp32-web
    volumes:
      - ./apps/web:/workspace/apps/web
      - web_node_modules:/workspace/apps/web/node_modules
    environment:
      NODE_ENV: development
      NPM_CONFIG_PRODUCTION: "false"
      NPM_CONFIG_OMIT: ""
      VITE_API_PROXY_TARGET: http://host.docker.internal:8000
    ports:
      - "5173:5173"

  # cortex + ollama run natively on host (Metal GPU for Ollama, native audio for TTS)

volumes:
  mosquitto_data:
  mosquitto_log:
  redis_data:
  web_node_modules:
